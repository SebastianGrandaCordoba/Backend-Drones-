# Blueprint de Render: backend (Spring Boot en Docker).
# La base de datos es MongoDB Atlas (plan gratuito); su cadena de conexión va en MONGODB_URI.
services:
  - type: web
    name: backend-drones
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/asignaciones/estrategias
    envVars:
      - key: MONGODB_URI
        # mongodb+srv://usuario:clave@cluster.mongodb.net/centro_control_drones
        sync: false
      - key: CORS_ORIGENES
        # URL del frontend en Render, por ejemplo https://frontend-drones.onrender.com
        sync: false
